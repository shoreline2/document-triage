# 1. Extract and decode the password from the CloudNativePG secret
DB_PASS=$(kubectl get secret postgres-cluster-app -n document-triage -o jsonpath='{.data.password}' | base64 -d)

# 2. Create the connection secret using the correct 'prefect' database name
kubectl create secret generic prefect-server-postgresql-connection \
  -n document-triage \
  --dry-run=client -o yaml \
  --from-literal=connection-string="postgresql+asyncpg://prefect:${DB_PASS}@postgres-cluster-rw.document-triage.svc.cluster.local:5432/prefect" \
  | kubectl apply -f -
