apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-cluster
  namespace: document-triage
spec:
  instances: 1

  storage:
    size: 1Gi
    storageClass: local-path

  bootstrap:
    initdb:
      database: prefect
      owner: prefect
      secret:
        name: postgres-password-secret

  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
