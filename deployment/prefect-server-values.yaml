ingress:
  enabled: false

postgresql:
  enabled: false

# Database configuration lives at the top level
database:
  driver: postgresql+asyncpg
  # Service endpoint created automatically by CNPG: <cluster-name>-rw.<namespace>.svc.cluster.local
  host: postgres-cluster-rw.document-triage.svc.cluster.local
  port: 5432
  name: prefect
  user: prefect
  passwordSecret:
    name: postgres-password-secret
    key: password

server:
  # Put other server-specific configs here if needed (e.g., replicas, env)
  enabled: true
